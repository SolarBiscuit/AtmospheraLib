modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
 modId = "${mod_id}"
 version = "${mod_version}"
 displayName = "${mod_name}"
 logoFile = "atmospheralib.png"
 authors = "${mod_authors}"
 credits = "Made by SolarBiscuit. GPL-3.0-only. Keep the copyright and attribution notices (see NOTICE)."
 description = '''${mod_description}'''
 # Optional on both sides: never required on servers, never blocks joining a server without it.
 displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
  modId = "forge"
  mandatory = true
  versionRange = "${forge_version_range}"
  ordering = "NONE"
  side = "BOTH"

[[dependencies.${mod_id}]]
  modId = "minecraft"
  mandatory = true
  versionRange = "${minecraft_version_range}"
  ordering = "NONE"
  side = "BOTH"

# Patches the Sodium-port terrain renderer. Without one, the library stays inactive.
[[dependencies.${mod_id}]]
  modId = "embeddium"
  mandatory = false
  versionRange = "*"
  ordering = "AFTER"
  side = "CLIENT"
